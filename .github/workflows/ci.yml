name: CI
on: [push, pull_request]
jobs:
  bb-run-test:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        bb-version: [1.3.190, latest]
    name: ${{ matrix.os }} bb ${{ matrix.bb-version }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: ${{ matrix.bb-version }}
      - run: bb run test
      - name: Upload debug log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-log-${{ matrix.os }}-bb-${{ matrix.bb-version }}
          path: debug.log

  bb-run-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bb-version: [1.3.190, latest]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: ${{ matrix.bb-version }}
          clj-kondo: latest
      - run: bb run lint
